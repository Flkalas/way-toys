[package]
name = "waytoys-zones-editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
waytoys-desktop = { path = "../waytoys-desktop" }
waytoys-zones = { path = "../waytoys-zones" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
fontdue = "0.9"
waytoys-zones-config = { path = "../waytoys-zones-config" }
serde_json = "1"
rustix = { version = "1", features = ["event"] }

