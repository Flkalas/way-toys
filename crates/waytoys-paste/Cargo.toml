[package]
name = "waytoys-paste"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
waytoys-desktop = { path = "../waytoys-desktop" }
waytoys-core = { path = "../waytoys-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "wayland", "x11", "thread-pool", "image-without-codecs"] }
futures-timer = "3"
async-channel = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
