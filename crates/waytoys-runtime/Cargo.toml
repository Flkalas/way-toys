[package]
name = "waytoys-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "waytoys"
path = "src/main.rs"

[dependencies]
tempfile = "3"
waytoys-desktop = { path = "../waytoys-desktop" }
waytoys-core = { path = "../waytoys-core" }
waytoys-zones = { path = "../waytoys-zones" }
waytoys-zones-config = { path = "../waytoys-zones-config" }
waytoys-zones-editor = { path = "../waytoys-zones-editor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
async-channel = "2"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "1", features = ["event"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
